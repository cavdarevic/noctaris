<script>
document.addEventListener("DOMContentLoaded", function () {
  const section = document.getElementById("photos");
  const items = Array.from(document.querySelectorAll(".photo-item"));
  const modal = document.getElementById("gallery-modal");
  const stage = document.getElementById("gallery-stage");
  const full = document.getElementById("gallery-full");
  const close = document.getElementById("gallery-close");
  const prev = document.getElementById("gallery-prev");
  const next = document.getElementById("gallery-next");
  let visible = [], current = 0, scale = 1, panX = 0, panY = 0, pointers = new Map(), startDist = 0, startScale = 1, lastCenter = null, dragStart = null, swipeStartX = 0, swipeStartY = 0;
  function setTransform() { full.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${scale})`; }
  function resetZoom() { scale = 1; panX = 0; panY = 0; setTransform(); }
  function clampScale(v) { return Math.min(Math.max(v, 1), 4); }
  function updateVisible() { visible = Array.from(document.querySelectorAll(".photo-item.is-visible")); }
  items.forEach(item => { const img = item.querySelector("img"); img.addEventListener("load", () => { item.classList.add("is-visible"); section.classList.add("has-images"); updateVisible(); }); img.addEventListener("error", () => { item.remove(); updateVisible(); }); item.addEventListener("click", () => { updateVisible(); current = visible.indexOf(item); openGallery(current); }); });
  function openGallery(i) { if (!visible.length || i < 0) return; current = i; resetZoom(); full.src = visible[current].querySelector("img").src; modal.classList.add("is-open"); modal.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
  function show(d) { if (!visible.length) return; current = (current + d + visible.length) % visible.length; resetZoom(); full.src = visible[current].querySelector("img").src; }
  function closeGallery() { modal.classList.remove("is-open"); modal.setAttribute("aria-hidden", "true"); full.removeAttribute("src"); document.body.style.overflow = ""; pointers.clear(); setTimeout(() => section.scrollIntoView({ behavior: "smooth", block: "start" }), 30); }
  function dist(a,b) { return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
  function center(a,b) { return { x:(a.clientX+b.clientX)/2, y:(a.clientY+b.clientY)/2 }; }
  stage.addEventListener("pointerdown", e => { if (e.target.classList.contains("gallery-close") || e.target.classList.contains("gallery-arrow")) return; stage.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e); swipeStartX = e.clientX; swipeStartY = e.clientY; if (pointers.size === 1) { dragStart = {x:e.clientX,y:e.clientY,panX,panY}; stage.classList.add("is-dragging"); } if (pointers.size === 2) { const pts = Array.from(pointers.values()); startDist = dist(pts[0], pts[1]); startScale = scale; lastCenter = center(pts[0], pts[1]); } });
  stage.addEventListener("pointermove", e => { if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, e); if (pointers.size === 2) { const pts = Array.from(pointers.values()), c = center(pts[0], pts[1]), d = dist(pts[0], pts[1]); scale = clampScale(startScale * (d / startDist)); if (lastCenter) { panX += c.x-lastCenter.x; panY += c.y-lastCenter.y; } lastCenter = c; setTransform(); } else if (pointers.size === 1 && scale > 1 && dragStart) { panX = dragStart.panX + (e.clientX-dragStart.x); panY = dragStart.panY + (e.clientY-dragStart.y); setTransform(); } });
  stage.addEventListener("pointerup", e => { const dx = e.clientX - swipeStartX, dy = e.clientY - swipeStartY; pointers.delete(e.pointerId); stage.classList.remove("is-dragging"); if (pointers.size === 0) { if (scale === 1 && Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) show(dx < 0 ? 1 : -1); dragStart = null; lastCenter = null; } });

<script id="noctaris-pedigree-modal-controller">
document.addEventListener("DOMContentLoaded", function () {
  const preview = document.querySelector("#pedigree .v8-tree-button, #open-pedigree-viewer");
  const modal = document.getElementById("pedigree-modal");
  const stage = document.getElementById("pedigree-stage");
  const content = document.getElementById("pedigree-zoom-content");
  const closeBtn = document.getElementById("pedigree-close");
  const hint = document.getElementById("pedigree-zoom-hint");
  if (!preview || !modal || !stage || !content || !closeBtn) return;

  let zoom = 1, panX = 0, panY = 0;
  let pointer = null;
  let lastTap = { time: 0, x: 0, y: 0 };
  let hintTimer = null;

  function zoomFactor() {
    return window.matchMedia("(max-width: 760px)").matches ? 5.0 : 3.0;
  }

  function applyView() {
    const base = Math.min(window.innerWidth * 0.96, 1680);
    content.style.setProperty("width", `${base * zoom}px`, "important");
    content.style.setProperty("transform", `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px))`, "important");
  }

  function resetView() {
    zoom = 1;
    panX = 0;
    panY = 0;
    applyView();
  }

  function showHint() {
    if (!hint) return;
    clearTimeout(hintTimer);
    hint.classList.remove("is-hiding");
    hint.classList.add("is-visible");
    hintTimer = setTimeout(function () {
      hint.classList.add("is-hiding");
      hint.classList.remove("is-visible");
    }, 2600);
  }

  function hideHint() {
    if (!hint) return;
    clearTimeout(hintTimer);
    hint.classList.remove("is-visible");
    hint.classList.add("is-hiding");
  }

  function openPedigree(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    }
    resetView();
    modal.classList.add("is-open");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    showHint();
  }

  function closePedigree(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    hideHint();
    modal.classList.remove("is-open");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    resetView();
    const pedigree = document.getElementById("pedigree");
    if (pedigree) setTimeout(function () {
      pedigree.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 30);
  }

  function toggleZoom(e) {
    if (!modal.classList.contains("is-open")) return;
    if (e) {
      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
    }
    hideHint();
    if (zoom === 1) {
      zoom = zoomFactor();
      panX = 0;
      panY = 0;
    } else {
      zoom = 1;
      panX = 0;
      panY = 0;
    }
    applyView();
  }

  preview.addEventListener("click", openPedigree, true);
  preview.addEventListener("pointerup", function (e) {
    if (!modal.classList.contains("is-open")) openPedigree(e);
  }, true);

  closeBtn.addEventListener("click", closePedigree, true);

  stage.addEventListener("dblclick", toggleZoom, true);
  content.addEventListener("dblclick", toggleZoom, true);

  stage.addEventListener("pointerdown", function (e) {
    if (!modal.classList.contains("is-open") || e.target.closest(".pedigree-close")) return;
    e.preventDefault();
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    pointer = { id: e.pointerId, x: e.clientX, y: e.clientY, panX: panX, panY: panY, moved: false };
  }, { passive: false, capture: true });

  stage.addEventListener("pointermove", function (e) {
    if (!pointer || pointer.id !== e.pointerId) return;
    const dx = e.clientX - pointer.x;
    const dy = e.clientY - pointer.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) pointer.moved = true;
    if (zoom > 1) {
      panX = pointer.panX + dx;
      panY = pointer.panY + dy;
      applyView();
    }
  }, { passive: false, capture: true });

  stage.addEventListener("pointerup", function (e) {
    if (!pointer || pointer.id !== e.pointerId) return;
    const moved = pointer.moved;
    pointer = null;
    if (moved) return;
    const now = Date.now();
    const distance = Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y);
    if (now - lastTap.time < 360 && distance < 38) {
      toggleZoom(e);
      lastTap = { time: 0, x: 0, y: 0 };
    } else {
      lastTap = { time: now, x: e.clientX, y: e.clientY };
    }
  }, { passive: false, capture: true });

  stage.addEventListener("pointercancel", function () {
    pointer = null;
  }, true);

  stage.addEventListener("wheel", function (e) {
    if (modal.classList.contains("is-open")) e.preventDefault();
  }, { passive: false });

  document.addEventListener("keydown", function (e) {
    if (modal.classList.contains("is-open") && e.key === "Escape") closePedigree(e);
  });
});
